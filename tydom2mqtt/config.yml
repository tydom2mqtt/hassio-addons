---

########## GENERAL SETTINGS ######################################################################################################
name: tydom2mqtt
image: ghcr.io/tydom2mqtt/tydom2mqtt
version: 3.7.0
slug: tydom2mqtt
description: Deltadore Tydom to MQTT Bridge
# 32-bit architectures (armhf, armv7, i386) are no longer supported by Home Assistant since 2025.12
arch:
  - aarch64
  - amd64
url: https://github.com/tydom2mqtt/tydom2mqtt
services:
  - mqtt:need

########## DEFAULT OPTIONS #######################################################################################################
options:
  TYDOM_MAC: 001A25XXXXXX
  TYDOM_IP: 192.168.1.XXX
  TYDOM_PASSWORD: TYDOM_PASSWORD
  TYDOM_ALARM_HOME_ZONE: 1
  TYDOM_ALARM_NIGHT_ZONE: 2
  TYDOM_POLLING_INTERVAL: 300
  MQTT_HOST: homeassistant
  MQTT_USER: ''
  MQTT_PASSWORD: ''
  MQTT_PORT: 1883
  MQTT_SSL: false
  THERMOSTAT_COOL_MODE_TEMP_DEFAULT: 26
  THERMOSTAT_HEAT_MODE_TEMP_DEFAULT: 16
  LOG_LEVEL: INFO

########## OPTIONS SCHEMA ########################################################################################################
schema:
  LOG_LEVEL: list(DEBUG|INFO|WARNING|ERROR)?
  TYDOM_MAC: match(^001A25.*$)
  TYDOM_IP: str?
  TYDOM_PASSWORD: password
  TYDOM_ALARM_PIN: str?
  TYDOM_ALARM_HOME_ZONE: int?
  TYDOM_ALARM_NIGHT_ZONE: int?
  TYDOM_POLLING_INTERVAL: int?
  TYDOM_CONFIG_REFRESH_INTERVAL: int?
  MQTT_HOST: str?
  MQTT_USER: str?
  MQTT_PASSWORD: password?
  MQTT_PORT: port?
  MQTT_SSL: bool?
  THERMOSTAT_CUSTOM_PRESETS: str?
  THERMOSTAT_COOL_MODE_TEMP_DEFAULT: int?
  THERMOSTAT_HEAT_MODE_TEMP_DEFAULT: int?
  DELTADORE_LOGIN: str?
  DELTADORE_PASSWORD: password?
